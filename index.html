<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111114">
  <title>Cruisin Materials Calculator</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: #111114;
      --line: #29292e;
      --yellow: #ffd400;
      --red: #ff3434;
      --green: #39d98a;
      --muted: #85858f;
      --white: #f4f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 14px;
      color: var(--white); background:
        radial-gradient(ellipse at 50% 0%, #242426 0%, transparent 55%), var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: min(100%, 1000px); margin: 0 auto; padding: 22px 24px 26px;
      background: linear-gradient(145deg, #141417, #0e0e11);
      border: 1px solid #303036; border-top: 5px solid var(--yellow);
      border-radius: 9px; box-shadow: 0 18px 55px #0009;
    }
    header { text-align: center; padding: 3px 0 22px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 8px; color: var(--yellow); font-size: clamp(24px, 4vw, 38px); letter-spacing: 1px; }
    header p { margin: 0; color: #c5c5cc; font-size: clamp(13px, 2vw, 18px); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th {
      padding: 17px 12px; color: var(--yellow); text-align: left;
      font-size: 14px; letter-spacing: .3px; white-space: nowrap;
    }
    td { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 15px; }
    tbody tr:last-child td { border-bottom: 1px solid var(--line); }
    td:first-child { font-weight: 700; }
    .number { font-variant-numeric: tabular-nums; }
    .usage {
      width: 120px; max-width: 100%; padding: 8px 9px; color: var(--white);
      background: #17171c; border: 1px solid #55555e; border-radius: 4px;
      text-align: center; font: inherit; font-variant-numeric: tabular-nums;
      outline: none;
    }
    .usage:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px #ffd40022; }
    .remaining { font-weight: 700; font-variant-numeric: tabular-nums; }
    .remaining.negative { color: var(--red); }
    .remaining.positive { color: var(--green); }
    .reset {
      display: block; width: 100%; margin-top: 22px; padding: 13px 12px;
      color: var(--yellow); background: transparent; border: 2px dashed var(--yellow);
      border-radius: 5px; font-weight: 800; font-size: 14px; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .reset:hover { background: #ffd40012; }
    .reset:active { transform: scale(.995); }
    .note { margin: 14px 0 0; color: var(--muted); text-align: center; font-size: 11px; }
    @media (max-width: 650px) {
      body { padding: 10px 6px; }
      .panel { padding: 16px 10px 20px; }
      th, td { padding-left: 9px; padding-right: 9px; }
      .usage { width: 94px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>CRUISIN MATERIALS CALCULATOR</h1>
      <p>Beheer je materialen eenvoudig en bereken het verbruik</p>
    </header>

    <div class="table-wrap">
      <table aria-label="Materialen en verbruik">
        <thead>
          <tr>
            <th>MATERIAAL</th>
            <th>BASISVOORRAAD</th>
            <th>HUIDIG GEBRUIK</th>
            <th>RESTVOORRAAD</th>
          </tr>
        </thead>
        <tbody id="materials"></tbody>
      </table>
    </div>

    <button class="reset" id="reset" type="button">↻ &nbsp; HUIDIG VERBRUIK RESETTEN (ZET OP 0)</button>
    <p class="note">Cruisin Materials Calculator · Je invoer wordt automatisch op dit toestel bewaard</p>
  </main>

  <script>
    const materials = [
      ["METAALSCHRO...", 3000],
      ["IJZER", 3000],
      ["STAAL", 3000],
      ["ALUMINIUM", 3000],
      ["RUBBER", 3000],
      ["KOPER", 3000],
      ["PLASTIC", 2000],
      ["GLASPLAAT", 2000],
      ["STOF", 2000],
      ["LEER", 2000],
      ["CAR PARTS", 2000],
      ["ELEKTRONISCH...", 2000]
    ];

    const storageKey = "cruisin-materials-usage-v1";
    let usageValues = {};
    try {
      usageValues = JSON.parse(localStorage.getItem(storageKey) || "{}") || {};
    } catch (_) {
      usageValues = {};
    }

    const format = value => new Intl.NumberFormat("nl-BE", {
      maximumFractionDigits: 0
    }).format(value);

    const tbody = document.getElementById("materials");

    function render() {
      tbody.innerHTML = "";
      materials.forEach(([name, base], index) => {
        const raw = Number(usageValues[index] ?? 0);
        const used = Number.isFinite(raw) ? Math.max(0, raw) : 0;
        const remaining = base - used;
        const tr = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.textContent = name;

        const baseCell = document.createElement("td");
        baseCell.className = "number";
        baseCell.textContent = format(base);

        const usageCell = document.createElement("td");
        const input = document.createElement("input");
        input.className = "usage";
        input.type = "number";
        input.min = "0";
        input.step = "1";
        input.inputMode = "numeric";
        input.setAttribute("aria-label", `Huidig gebruik ${name}`);
        input.value = String(used);
        input.addEventListener("input", () => {
          const next = Math.max(0, Math.floor(Number(input.value) || 0));
          usageValues[index] = next;
          try { localStorage.setItem(storageKey, JSON.stringify(usageValues)); } catch (_) {}
          updateRemaining(remainingCell, base, next);
        });
        usageCell.appendChild(input);

        const remainingCell = document.createElement("td");
        remainingCell.className = "remaining number";
        updateRemaining(remainingCell, base, used);

        tr.append(nameCell, baseCell, usageCell, remainingCell);
        tbody.appendChild(tr);
      });
    }

    function updateRemaining(cell, base, used) {
      const remaining = base - used;
      cell.textContent = format(remaining);
      cell.className = "remaining number " + (remaining < 0 ? "negative" : "positive");
    }

    document.getElementById("reset").addEventListener("click", () => {
      usageValues = {};
      try { localStorage.removeItem(storageKey); } catch (_) {}
      render();
    });

    render();
  </script>
</body>
</html>
